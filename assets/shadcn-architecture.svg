<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#090b10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e15"/>
      <stop offset="50%" stop-color="#080a0f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161a24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f121a" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="860" fill="url(#bg-grad)"/>
  <rect width="1200" height="860" fill="url(#grid-pattern)"/>

  <!-- Ambient Glow Spotlights -->
  <circle cx="200" cy="150" r="180" fill="#3b82f6" fill-opacity="0.04" filter="url(#subtle-glow)"/>
  <circle cx="1000" cy="400" r="220" fill="#10b981" fill-opacity="0.03" filter="url(#subtle-glow)"/>
  <circle cx="600" cy="750" r="250" fill="#8b5cf6" fill-opacity="0.03" filter="url(#subtle-glow)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="38" y="16" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">SHADCN</text>

    <text x="90" y="20" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">Enterprise Architecture &amp; Component Ecosystem</text>
    <text x="90" y="44" fill="#94a3b8" font-size="13" font-weight="400">217+ Validated Items · Full Admin &amp; SaaS Suite · Motion-Anything · Dual-Sync CI/CD</text>

    <rect x="940" y="4" width="140" height="32" rx="16" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <circle cx="958" cy="20" r="4" fill="#10b981"/>
    <text x="970" y="24" fill="#34d399" font-size="12" font-weight="600">Production Ready</text>
  </g>

  <!-- ==================== LAYER 1: FOUNDATION & TOKENS ==================== -->
  <g transform="translate(60, 125)">
    <!-- Container -->
    <rect x="0" y="0" width="1080" height="110" rx="14" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Title Tag -->
    <rect x="20" y="16" width="180" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="33" fill="#38bdf8" font-size="12" font-weight="700">01. DESIGN FOUNDATIONS</text>

    <!-- Sub-cards -->
    <!-- Token Item 1 -->
    <g transform="translate(220, 16)">
      <rect width="260" height="78" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">OKLCH Semantic Tokens</text>
      <text x="16" y="42" fill="#64748b" font-size="11">Light &amp; Dark Mode Synchronization</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11" font-family="monospace">:root / .dark (Obsidian &amp; Ivory)</text>
    </g>

    <!-- Token Item 2 -->
    <g transform="translate(495, 16)">
      <rect width="260" height="78" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Adaptive Geometry (--radius)</text>
      <text x="16" y="42" fill="#64748b" font-size="11">Proportional scale: 0.6x → 2.6x</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11" font-family="monospace">--radius-sm .. --radius-4xl</text>
    </g>

    <!-- Token Item 3 -->
    <g transform="translate(770, 16)">
      <rect width="290" height="78" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Accessibility &amp; CVA Matrix</text>
      <text x="16" y="42" fill="#64748b" font-size="11">Radix UI Primitives &amp; Lucide Icons</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11" font-family="monospace">data-[state] · focus-visible:ring</text>
    </g>
  </g>

  <!-- Connecting Line 1 -> 2 -->
  <path d="M 600 235 L 600 255" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="245" r="3" fill="#38bdf8"/>

  <!-- ==================== LAYER 2: COMPONENT REGISTRIES ==================== -->
  <g transform="translate(60, 255)">
    <!-- Container -->
    <rect x="0" y="0" width="1080" height="260" rx="14" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Title Tag -->
    <rect x="20" y="16" width="220" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="33" fill="#34d399" font-size="12" font-weight="700">02. COMPONENT REGISTRIES</text>

    <!-- Column 1: @altetsa Core Registry -->
    <g transform="translate(20, 56)">
      <rect width="330" height="186" rx="10" fill="#111520" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="12" width="140" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="22" y="26" fill="#34d399" font-size="11" font-weight="700">@altetsa (217 Items)</text>
      
      <text x="16" y="52" fill="#f8fafc" font-size="13" font-weight="600">Core UI &amp; Marketing Blocks</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">• 50+ Core UI (Button, Dialog, Sheet, Tabs)</text>
      <text x="16" y="94" fill="#94a3b8" font-size="11">• 55+ Blocks (Hero1..115, Pricing, Features)</text>
      <text x="16" y="114" fill="#94a3b8" font-size="11">• Aceternity (Background-Lines)</text>
      <text x="16" y="134" fill="#94a3b8" font-size="11">• Kibo UI (Code-Block Component)</text>
      <rect x="16" y="148" width="298" height="24" rx="4" fill="#0a0d14"/>
      <text x="24" y="164" fill="#38bdf8" font-size="10" font-family="monospace">npx shadcn@latest add @altetsa/button</text>
    </g>

    <!-- Column 2: shadcn-admin Suite -->
    <g transform="translate(370, 56)">
      <rect width="340" height="186" rx="10" fill="#111520" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="12" width="165" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
      <text x="22" y="26" fill="#60a5fa" font-size="11" font-weight="700">shadcn-admin Suite</text>
      
      <text x="16" y="52" fill="#f8fafc" font-size="13" font-weight="600">Production SaaS &amp; Admin Tools</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">• TanStack Table (URL state, Faceted filters)</text>
      <text x="16" y="94" fill="#94a3b8" font-size="11">• Tasks Kanban &amp; User Directory with drawers</text>
      <text x="16" y="114" fill="#94a3b8" font-size="11">• Full Auth: Sign In, Sign Up, OTP, Recovery</text>
      <text x="16" y="134" fill="#94a3b8" font-size="11">• Analytics Charts &amp; Settings panels</text>
      <rect x="16" y="148" width="308" height="24" rx="4" fill="#0a0d14"/>
      <text x="24" y="164" fill="#60a5fa" font-size="10" font-family="monospace">cd shadcn-admin &amp;&amp; pnpm dev</text>
    </g>

    <!-- Column 3: Ecosystem Partners -->
    <g transform="translate(730, 56)">
      <rect width="330" height="186" rx="10" fill="#111520" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="12" width="160" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.15"/>
      <text x="22" y="26" fill="#c084fc" font-size="11" font-weight="700">Ecosystem Partners</text>
      
      <text x="16" y="52" fill="#f8fafc" font-size="13" font-weight="600">Specialized UI Enhancements</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">• @magicui: Border Beam, Bento Grid, Particles</text>
      <text x="16" y="94" fill="#94a3b8" font-size="11">• @cult-ui: Halo Button, Dynamic Island</text>
      <text x="16" y="114" fill="#94a3b8" font-size="11">• @shadcnblocks: 2,295+ verified sections</text>
      <text x="16" y="134" fill="#94a3b8" font-size="11">• 21st.dev: Global catalog via CLI/MCP</text>
      <rect x="16" y="148" width="298" height="24" rx="4" fill="#0a0d14"/>
      <text x="24" y="164" fill="#c084fc" font-size="10" font-family="monospace">21st add &lt;author&gt;/&lt;slug&gt;</text>
    </g>
  </g>

  <!-- Connecting Line 2 -> 3 -->
  <path d="M 600 515 L 600 535" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="525" r="3" fill="#8b5cf6"/>

  <!-- ==================== LAYER 3: MOTION & WORKFLOW ==================== -->
  <g transform="translate(60, 535)">
    <!-- Container -->
    <rect x="0" y="0" width="1080" height="125" rx="14" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Title Tag -->
    <rect x="20" y="16" width="220" height="26" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="32" y="33" fill="#c084fc" font-size="12" font-weight="700">03. MOTION &amp; AI AUTOMATION</text>

    <!-- Sub-cards -->
    <!-- Motion Card -->
    <g transform="translate(260, 16)">
      <rect width="380" height="92" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Motion-Anything Engine</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">218+ motion recipes · GSAP ScrollTrigger</text>
      <text x="16" y="64" fill="#94a3b8" font-size="11">Framer Motion springs · WebGL Shaders &amp; Canvas</text>
      <text x="16" y="82" fill="#64748b" font-size="10" font-family="monospace">Interactive micro-gestures &amp; transitions</text>
    </g>

    <!-- AI Automation Card -->
    <g transform="translate(660, 16)">
      <rect width="400" height="92" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">v0-ctl &amp; OpenDesign CLI</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Direct v0 API integration (create, iterate, pull code)</text>
      <text x="16" y="64" fill="#94a3b8" font-size="11">Figma MCP translation · OpenDesign daemon (:7456)</text>
      <text x="16" y="82" fill="#64748b" font-size="10" font-family="monospace">v0-ctl create "prompt" &amp;&amp; v0-ctl pull</text>
    </g>
  </g>

  <!-- Connecting Line 3 -> 4 -->
  <path d="M 600 660 L 600 680" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="670" r="3" fill="#f59e0b"/>

  <!-- ==================== LAYER 4: TARGET DELIVERY ==================== -->
  <g transform="translate(60, 680)">
    <!-- Container -->
    <rect x="0" y="0" width="1080" height="135" rx="14" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Title Tag -->
    <rect x="20" y="16" width="220" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="33" fill="#fbbf24" font-size="12" font-weight="700">04. TARGET PLATFORMS</text>

    <!-- App Target: Arteefa -->
    <g transform="translate(260, 16)">
      <rect width="380" height="102" rx="8" fill="#131722" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
      <text x="16" y="24" fill="#fbbf24" font-size="14" font-weight="700">Arteefa Gallery &amp; E-Commerce</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Next.js 15 · OpenSeadragon (Gigapixel Art Zoom)</text>
      <text x="16" y="64" fill="#94a3b8" font-size="11">Payload CMS 3.x · Cloudflare D1/R2/Workers</text>
      <text x="16" y="86" fill="#34d399" font-size="10" font-weight="600">✓ Repos: GitLab &amp; GitHub Synced</text>
    </g>

    <!-- CI/CD & Deploy Target -->
    <g transform="translate(660, 16)">
      <rect width="400" height="102" rx="8" fill="#131722" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-size="14" font-weight="700">CI/CD, Vercel &amp; Knowledge Base</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Dual Remote Sync: GitLab (altetsagroup) &amp; GitHub (altetsa)</text>
      <text x="16" y="64" fill="#94a3b8" font-size="11">Vercel MCP Deployments &amp; Runtime Observation</text>
      <text x="16" y="86" fill="#38bdf8" font-size="10" font-weight="600">✓ Obsidian Auto-Sync (altetsa/Obsidian)</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(60, 835)">
    <text x="0" y="0" fill="#475569" font-size="11">ShadCN Master Architecture &amp; Component Registry System</text>
    <text x="1080" y="0" fill="#475569" font-size="11" text-anchor="end">MIT © 2026 altetsa · Enterprise Ready</text>
  </g>
</svg>
